<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PROTOTYPE - Equipment & Arms Management [E]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          "Kanit",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        user-select: none;
      }

      body {
        background: #090d16;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-x: hidden;
        background-image:
          radial-gradient(
            circle at 50% 20%,
            rgba(56, 189, 248, 0.08) 0%,
            transparent 60%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(251, 191, 36, 0.05) 0%,
            transparent 50%
          );
      }

      .top-banner {
        margin-bottom: 16px;
        text-align: center;
      }

      .top-banner h1 {
        font-size: 20px;
        font-weight: 700;
        color: #f8fafc;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .top-banner .badge {
        background: #fbbf24;
        color: #0f172a;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        text-transform: uppercase;
      }

      .top-banner p {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 4px;
      }

      /* Modal Wrapper Mock */
      .modal-frame {
        width: 100%;
        max-width: 820px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 12px;
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.05);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 520px;
        position: relative;
      }

      .modal-header {
        background: #1e293b;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #334155;
      }

      .modal-header-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 600;
        color: #f1f5f9;
      }

      .modal-header-title span.hotkey {
        background: rgba(56, 189, 248, 0.15);
        border: 1px solid #38bdf8;
        color: #38bdf8;
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 4px;
        font-weight: 700;
      }

      .btn-close {
        background: transparent;
        border: none;
        color: #94a3b8;
        font-size: 18px;
        cursor: pointer;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 4px;
      }
      .btn-close:hover {
        background: #334155;
        color: #f8fafc;
      }

      /* ========================================================= */
      /* VARIANT A: TACTICAL 3-COLUMN WORKSTATION                  */
      /* ========================================================= */
      .variant-a {
        display: grid;
        grid-template-columns: 210px 1fr 220px;
        min-height: 480px;
      }

      /* Col 1: Unit List */
      .va-unit-col {
        background: #111827;
        border-right: 1px solid #1f2937;
        padding: 14px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .va-col-title {
        font-size: 11px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 0 4px 6px 4px;
      }

      .va-unit-card {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
        transition: all 0.15s ease;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .va-unit-card:hover {
        background: #273548;
        border-color: #4b5563;
      }

      .va-unit-card.active {
        background: #1e3a5f;
        border-color: #38bdf8;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
      }

      .va-unit-avatar {
        font-size: 22px;
        width: 36px;
        height: 36px;
        background: #0f172a;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #334155;
      }

      .va-unit-meta {
        flex: 1;
        overflow: hidden;
      }

      .va-unit-name {
        font-size: 13px;
        font-weight: 600;
        color: #f1f5f9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .va-unit-tag {
        font-size: 10px;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* Col 2: Central Paperdoll & Stats */
      .va-center-col {
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: #0b1120;
      }

      .va-header-strip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #1e293b;
        padding-bottom: 10px;
      }

      .va-selected-title {
        font-size: 16px;
        font-weight: 700;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Paperdoll Board */
      .va-paperdoll-board {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .va-slot-box {
        background: #131c2e;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.2s;
      }

      .va-slot-box.equipped {
        border-color: #f59e0b;
        background: rgba(245, 158, 11, 0.05);
      }

      .va-slot-icon {
        width: 38px;
        height: 38px;
        background: #1e293b;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        border: 1px solid #334155;
      }

      .va-slot-box.equipped .va-slot-icon {
        background: rgba(245, 158, 11, 0.15);
        border-color: #f59e0b;
      }

      .va-slot-info {
        flex: 1;
      }

      .va-slot-type {
        font-size: 10px;
        color: #64748b;
        text-transform: uppercase;
        font-weight: 600;
      }

      .va-slot-name {
        font-size: 12px;
        font-weight: 600;
        color: #f1f5f9;
      }

      .va-slot-box.equipped .va-slot-name {
        color: #fbbf24;
      }

      .va-slot-stats {
        font-size: 10px;
        color: #4ade80;
      }

      .btn-unequip-sm {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #f87171;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 10px;
        cursor: pointer;
      }
      .btn-unequip-sm:hover {
        background: rgba(239, 68, 68, 0.3);
        color: #fff;
      }

      /* Col 3: Quick Inventory Bag */
      .va-inv-col {
        background: #111827;
        border-left: 1px solid #1f2937;
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
      }

      .va-bag-grid {
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow-y: auto;
        max-height: 400px;
      }

      .va-bag-item {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 6px 8px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.15s;
      }

      .va-bag-item:hover {
        border-color: #38bdf8;
        background: #24344d;
      }

      .va-bag-icon {
        font-size: 18px;
      }

      .va-bag-meta {
        flex: 1;
      }

      .va-bag-name {
        font-size: 11px;
        font-weight: 600;
        color: #e2e8f0;
      }

      .va-bag-slot {
        font-size: 9px;
        color: #94a3b8;
      }

      .btn-equip-action {
        background: #0284c7;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 10px;
        padding: 2px 6px;
        cursor: pointer;
      }
      .btn-equip-action:hover {
        background: #0369a1;
      }

      /* ========================================================= */
      /* VARIANT B: HEROIC CAROUSEL & IMMERSIVE INSPECTOR          */
      /* ========================================================= */
      .variant-b {
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 14px;
        background: #0d131f;
      }

      .vb-top-carousel {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .vb-char-tab {
        background: #172033;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        min-width: 170px;
        transition: all 0.2s ease;
      }

      .vb-char-tab:hover {
        background: #1e293b;
        border-color: #64748b;
      }

      .vb-char-tab.active {
        background: linear-gradient(135deg, #1e3a5f, #0f243d);
        border-color: #38bdf8;
        box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
      }

      .vb-tab-avatar {
        font-size: 26px;
      }

      .vb-tab-title {
        font-size: 13px;
        font-weight: 700;
        color: #f8fafc;
      }

      .vb-tab-sub {
        font-size: 10px;
        color: #94a3b8;
      }

      .vb-main-view {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 16px;
        background: #111a2e;
        border: 1px solid #1e293b;
        border-radius: 10px;
        padding: 16px;
      }

      .vb-silhouette-panel {
        background: #0a0f1d;
        border: 1px solid #1f293d;
        border-radius: 8px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .vb-big-avatar {
        font-size: 72px;
        margin-bottom: 8px;
        filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.3));
      }

      .vb-unit-rank {
        font-size: 14px;
        font-weight: 700;
        color: #fbbf24;
      }

      .vb-stat-chips {
        margin-top: 14px;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .vb-stat-chip {
        background: #162032;
        border: 1px solid #27354a;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 11px;
        display: flex;
        justify-content: space-between;
      }

      .vb-slots-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .vb-slot-card {
        background: #172236;
        border: 1px solid #27374d;
        border-radius: 8px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .vb-slot-card.equipped {
        border-color: #f59e0b;
        background: rgba(245, 158, 11, 0.08);
      }

      /* ========================================================= */
      /* VARIANT C: SPLIT PARTY ARMORY (TEAM SIDE-BY-SIDE)         */
      /* ========================================================= */
      .variant-c {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 16px;
        background: #090e1a;
        overflow-x: auto;
      }

      .vc-party-card {
        background: #131b2e;
        border: 1px solid #25334d;
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .vc-party-card.hero-card {
        border-color: #38bdf8;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
      }

      .vc-header {
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid #1f2d47;
        padding-bottom: 8px;
      }

      .vc-avatar {
        font-size: 24px;
        background: #0b1120;
        border: 1px solid #334155;
        border-radius: 6px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .vc-meta h4 {
        font-size: 13px;
        color: #f8fafc;
      }
      .vc-meta p {
        font-size: 10px;
        color: #94a3b8;
      }

      .vc-slots-compact {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .vc-compact-slot {
        background: #0c1220;
        border: 1px solid #1e2c45;
        border-radius: 6px;
        padding: 5px 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
      }

      .vc-compact-slot.equipped {
        border-color: #f59e0b;
        background: rgba(245, 158, 11, 0.08);
        color: #fbbf24;
      }

      /* ========================================================= */
      /* FLOATING SWITCHER BAR                                     */
      /* ========================================================= */
      .switcher-bar {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #020617;
        border: 1px solid #38bdf8;
        border-radius: 9999px;
        padding: 6px 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.8),
          0 0 20px rgba(56, 189, 248, 0.3);
        z-index: 9999;
      }

      .switcher-btn {
        background: #1e293b;
        border: 1px solid #475569;
        color: #f8fafc;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.15s;
      }

      .switcher-btn:hover {
        background: #38bdf8;
        color: #020617;
        border-color: #38bdf8;
      }

      .switcher-label {
        font-size: 13px;
        font-weight: 600;
        color: #38bdf8;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .switcher-sub {
        color: #94a3b8;
        font-weight: 400;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="top-banner">
      <h1>
        🛡️ PROTOTYPE: Equipment & Arms Hub [E]
        <span class="badge">Throwaway Prototype</span>
      </h1>
      <p>
        กดปุ่ม <code>←</code> หรือ <code>→</code> บนคีย์บอร์ด
        หรือใช้แถบสลับด้านล่างเพื่อเปรียบเทียบทั้ง 3 รูปแบบ
      </p>
    </div>

    <div class="modal-frame">
      <!-- Common Header -->
      <div class="modal-header">
        <div class="modal-header-title">
          <span
            >🛡️ ศูนย์บริหารอุปกรณ์และศาสตราวุธ (Equipment & Völundr Arms)</span
          >
          <span class="hotkey">Hotkey [E]</span>
        </div>
        <button class="btn-close" onclick="alert('ปิดหน้าต่าง [ESC]')">
          ✕
        </button>
      </div>

      <!-- Active Variant Container -->
      <div id="variant-container"></div>
    </div>

    <!-- Floating Prototype Switcher -->
    <div class="switcher-bar">
      <button class="switcher-btn" id="btn-prev" title="ก่อนหน้า (ลูกศรซ้าย)">
        ◀
      </button>
      <div class="switcher-label" id="switcher-text">
        Variant A: Tactical Workstation
      </div>
      <button class="switcher-btn" id="btn-next" title="ถัดไป (ลูกศรขวา)">
        ▶
      </button>
    </div>

    <script>
      // State Model for Prototype
      const state = {
        selectedUnitId: "hero",
        units: [
          {
            id: "hero",
            name: "Li Xiao Long (ตัวหลัก)",
            title: "Hero / Martial Ascendant",
            element: "fire",
            elementIcon: "🔥",
            level: 10,
            avatar: "🧙",
            baseStats: { atk: 20, def: 15, int: 10, agi: 12, hp: 150, sp: 50 },
            equipment: {
              weapon: {
                id: "weapon_bronze_gladius",
                name: "Bronze Gladius",
                icon: "⚔️",
                stats: "+12 ATK",
              },
              head: {
                id: "head_iron_circlet",
                name: "Iron Circlet",
                icon: "🪖",
                stats: "+8 DEF, +15 Max SP",
              },
              armor: {
                id: "armor_einherjar_tunic",
                name: "Einherjar Battle Tunic",
                icon: "🛡️",
                stats: "+12 DEF, +30 HP",
              },
              boots: null,
              accessory: null,
            },
          },
          {
            id: "lubu",
            name: "Lu Bu (ลิโป้)",
            title: "Flying General of the Apocalypse",
            element: "fire",
            elementIcon: "🔥",
            level: 10,
            avatar: "⚡",
            baseStats: { atk: 30, def: 20, int: 8, agi: 15, hp: 200, sp: 60 },
            equipment: {
              weapon: {
                id: "weapon_sky_piercer",
                name: "Lu Bu's Sky Piercer",
                icon: "⚔️",
                stats: "+26 ATK, +6 AGI",
              },
              head: null,
              armor: null,
              boots: null,
              accessory: {
                id: "acc_draupnir_ring",
                name: "Draupnir Ring of Odin",
                icon: "💍",
                stats: "+8 All Stats",
              },
            },
          },
          {
            id: "thor",
            name: "Thor (ธอร์)",
            title: "Thunder God of Asgard",
            element: "wind",
            elementIcon: "⚡",
            level: 12,
            avatar: "🔨",
            baseStats: { atk: 35, def: 25, int: 12, agi: 10, hp: 250, sp: 70 },
            equipment: {
              weapon: {
                id: "weapon_mjolnir_replica",
                name: "Mjolnir's Echo",
                icon: "🔨",
                stats: "+30 ATK, +20 Max SP",
              },
              head: {
                id: "head_valkyrie_winged_helm",
                name: "Valkyrie Winged Helm",
                icon: "🪖",
                stats: "+14 DEF, +40 HP",
              },
              armor: {
                id: "armor_valhalla_plate",
                name: "Valhalla Divine Breastplate",
                icon: "🛡️",
                stats: "+24 DEF, +80 HP",
              },
              boots: null,
              accessory: null,
            },
          },
          {
            id: "kojiro",
            name: "Sasaki Kojiro (โคจิโร่)",
            title: "History's Greatest Loser",
            element: "water",
            elementIcon: "🌊",
            level: 9,
            avatar: "🗡️",
            baseStats: { atk: 22, def: 14, int: 14, agi: 22, hp: 160, sp: 55 },
            equipment: {
              weapon: {
                id: "weapon_monohoshizao",
                name: "Monohoshizao",
                icon: "🗡️",
                stats: "+22 ATK, +14 AGI",
              },
              head: null,
              armor: null,
              boots: {
                id: "boots_hermes_sandals",
                name: "Winged Sandals of Hermes",
                icon: "👢",
                stats: "+16 AGI, +6 DEF",
              },
              accessory: null,
            },
          },
        ],
        bag: [
          {
            id: "boots_leather_boots",
            name: "Leather Greaves",
            slot: "boots",
            icon: "👢",
            stats: "+6 AGI, +4 DEF",
          },
          {
            id: "acc_eden_amulet",
            name: "Amulet of Eden",
            slot: "accessory",
            icon: "📿",
            stats: "+60 HP, +30 SP",
          },
          {
            id: "head_valkyrie_winged_helm",
            name: "Valkyrie Helm",
            slot: "head",
            icon: "🪖",
            stats: "+14 DEF, +40 HP",
          },
        ],
      };

      // Calculate effective bonus
      function calcBonus(unit) {
        let b = { atk: 0, def: 0, int: 0, agi: 0, hp: 0, sp: 0 };
        Object.values(unit.equipment).forEach((eq) => {
          if (!eq) return;
          if (eq.id === "weapon_bronze_gladius") b.atk += 12;
          if (eq.id === "head_iron_circlet") {
            b.def += 8;
            b.sp += 15;
          }
          if (eq.id === "armor_einherjar_tunic") {
            b.def += 12;
            b.hp += 30;
          }
          if (eq.id === "weapon_sky_piercer") {
            b.atk += 26;
            b.agi += 6;
          }
          if (eq.id === "acc_draupnir_ring") {
            b.atk += 8;
            b.def += 8;
            b.int += 8;
            b.agi += 8;
          }
          if (eq.id === "weapon_mjolnir_replica") {
            b.atk += 30;
            b.sp += 20;
          }
          if (eq.id === "head_valkyrie_winged_helm") {
            b.def += 14;
            b.hp += 40;
          }
          if (eq.id === "armor_valhalla_plate") {
            b.def += 24;
            b.hp += 80;
          }
          if (eq.id === "weapon_monohoshizao") {
            b.atk += 22;
            b.agi += 14;
          }
          if (eq.id === "boots_hermes_sandals") {
            b.agi += 16;
            b.def += 6;
          }
          if (eq.id === "boots_leather_boots") {
            b.agi += 6;
            b.def += 4;
          }
          if (eq.id === "acc_eden_amulet") {
            b.hp += 60;
            b.sp += 30;
          }
        });
        return b;
      }

      function unequip(slot) {
        const u = state.units.find((x) => x.id === state.selectedUnitId);
        if (u && u.equipment[slot]) {
          state.bag.push({ ...u.equipment[slot], slot });
          u.equipment[slot] = null;
          render();
        }
      }

      function equipFromBag(bagIndex) {
        const item = state.bag[bagIndex];
        const u = state.units.find((x) => x.id === state.selectedUnitId);
        if (item && u) {
          const old = u.equipment[item.slot];
          u.equipment[item.slot] = item;
          state.bag.splice(bagIndex, 1);
          if (old) {
            state.bag.push({ ...old, slot: item.slot });
          }
          render();
        }
      }

      // =========================================================
      // RENDER VARIANTS
      // =========================================================
      const variants = [
        {
          key: "A",
          name: "Tactical Workstation (3 คอลัมน์: สมาชิก + อุปกรณ์ + กระเป๋า)",
          render: renderVariantA,
        },
        {
          key: "B",
          name: "Heroic Inspector (แบนเนอร์เลือกตัวละคร + เปรียบเทียบสเตตัสใหญ่)",
          render: renderVariantB,
        },
        {
          key: "C",
          name: "Party Armory (ดูและบริหารทั้งปาร์ตี้พร้อมกันแบบตาราง)",
          render: renderVariantC,
        },
      ];

      let currentVariantIndex = 0;

      function renderVariantA() {
        const activeUnit = state.units.find(
          (u) => u.id === state.selectedUnitId
        );
        const bonus = calcBonus(activeUnit);
        const slotKeys = ["head", "weapon", "armor", "boots", "accessory"];
        const slotLabels = {
          head: "🪖 Head",
          weapon: "⚔️ Weapon",
          armor: "🛡️ Armor",
          boots: "👢 Boots",
          accessory: "💍 Accessory",
        };

        return `
        <div class="variant-a">
          <!-- Col 1: Unit Roster -->
          <div class="va-unit-col">
            <div class="va-col-title">เลือกตัวละคร (Select Unit)</div>
            ${state.units
              .map(
                (u) => `
              <div class="va-unit-card ${u.id === state.selectedUnitId ? "active" : ""}" onclick="state.selectedUnitId = '${u.id}'; render();">
                <div class="va-unit-avatar">${u.avatar}</div>
                <div class="va-unit-meta">
                  <div class="va-unit-name">${u.name}</div>
                  <div class="va-unit-tag">${u.elementIcon} Lv.${u.level} &bull; ${u.id === "hero" ? "ตัวหลัก" : "ขุนพล"}</div>
                </div>
              </div>
            `
              )
              .join("")}
          </div>

          <!-- Col 2: Central Paperdoll & Stats -->
          <div class="va-center-col">
            <div class="va-header-strip">
              <div class="va-selected-title">
                <span>${activeUnit.avatar}</span>
                <span>${activeUnit.name}</span>
                <span style="font-size: 11px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 2px 6px; border-radius: 4px;">Lv.${activeUnit.level} ${activeUnit.title}</span>
              </div>
              <div style="font-size: 11px; color: #4ade80; font-weight: 600;">
                ATK ${activeUnit.baseStats.atk + bonus.atk} (+${bonus.atk}) &bull; DEF ${activeUnit.baseStats.def + bonus.def} (+${bonus.def})
              </div>
            </div>

            <!-- 5 Slots -->
            <div class="va-paperdoll-board">
              ${slotKeys
                .map((slot) => {
                  const eq = activeUnit.equipment[slot];
                  if (eq) {
                    return `
                    <div class="va-slot-box equipped">
                      <div class="va-slot-icon">${eq.icon}</div>
                      <div class="va-slot-info">
                        <div class="va-slot-type">${slotLabels[slot]}</div>
                        <div class="va-slot-name">${eq.name}</div>
                        <div class="va-slot-stats">${eq.stats}</div>
                      </div>
                      <button class="btn-unequip-sm" onclick="unequip('${slot}')">✕ ถอด</button>
                    </div>
                  `;
                  }
                  return `
                  <div class="va-slot-box">
                    <div class="va-slot-icon" style="opacity: 0.35;">${slotLabels[slot].split(" ")[0]}</div>
                    <div class="va-slot-info">
                      <div class="va-slot-type">${slotLabels[slot]}</div>
                      <div class="va-slot-name" style="color: #64748b;">(ว่าง / Empty)</div>
                    </div>
                  </div>
                `;
                })
                .join("")}
            </div>

            <div style="font-size: 11px; color: #94a3b8; background: #0f172a; padding: 8px 12px; border-radius: 6px; border: 1px solid #1e293b;">
              💡 <strong>เทคนิค:</strong> คลิกเลือกไอเทมจากกระเป๋าด้านขวามือเพื่อสวมใส่ให้ ${activeUnit.name} ได้ทันที
            </div>
          </div>

          <!-- Col 3: Quick Inventory Bag -->
          <div class="va-inv-col">
            <div class="va-col-title">กระเป๋าของสวมใส่ (Gear Bag)</div>
            <div class="va-bag-grid">
              ${state.bag.length === 0 ? '<div style="color: #64748b; font-size: 11px; text-align: center; padding: 20px;">ไม่มีอุปกรณ์เหลือในกระเป๋า</div>' : ""}
              ${state.bag
                .map(
                  (item, idx) => `
                <div class="va-bag-item" onclick="equipFromBag(${idx})">
                  <div class="va-bag-icon">${item.icon}</div>
                  <div class="va-bag-meta">
                    <div class="va-bag-name">${item.name}</div>
                    <div class="va-bag-slot">${item.stats}</div>
                  </div>
                  <button class="btn-equip-action">ใส่</button>
                </div>
              `
                )
                .join("")}
            </div>
          </div>
        </div>
      `;
      }

      function renderVariantB() {
        const activeUnit = state.units.find(
          (u) => u.id === state.selectedUnitId
        );
        const bonus = calcBonus(activeUnit);
        const slotKeys = ["head", "weapon", "armor", "boots", "accessory"];
        const slotLabels = {
          head: "🪖 Headgear",
          weapon: "⚔️ Weapon (Völundr)",
          armor: "🛡️ Armor / Robe",
          boots: "👢 Greaves",
          accessory: "💍 Relic",
        };

        return `
        <div class="variant-b">
          <!-- Top Horizontal Carousel -->
          <div class="vb-top-carousel">
            ${state.units
              .map(
                (u) => `
              <div class="vb-char-tab ${u.id === state.selectedUnitId ? "active" : ""}" onclick="state.selectedUnitId = '${u.id}'; render();">
                <div class="vb-tab-avatar">${u.avatar}</div>
                <div>
                  <div class="vb-tab-title">${u.name}</div>
                  <div class="vb-tab-sub">${u.elementIcon} Lv.${u.level} &bull; ${u.id === "hero" ? "Player Hero" : "Einherjar"}</div>
                </div>
              </div>
            `
              )
              .join("")}
          </div>

          <!-- Main Inspector -->
          <div class="vb-main-view">
            <div class="vb-silhouette-panel">
              <div class="vb-big-avatar">${activeUnit.avatar}</div>
              <div class="vb-unit-rank">${activeUnit.name}</div>
              <div style="font-size: 11px; color: #94a3b8; text-align: center;">${activeUnit.title}</div>

              <div class="vb-stat-chips">
                <div class="vb-stat-chip">
                  <span>ATK:</span>
                  <strong style="color: #4ade80;">${activeUnit.baseStats.atk + bonus.atk} (+${bonus.atk})</strong>
                </div>
                <div class="vb-stat-chip">
                  <span>DEF:</span>
                  <strong style="color: #4ade80;">${activeUnit.baseStats.def + bonus.def} (+${bonus.def})</strong>
                </div>
                <div class="vb-stat-chip">
                  <span>INT:</span>
                  <strong style="color: #4ade80;">${activeUnit.baseStats.int + bonus.int} (+${bonus.int})</strong>
                </div>
                <div class="vb-stat-chip">
                  <span>AGI:</span>
                  <strong style="color: #4ade80;">${activeUnit.baseStats.agi + bonus.agi} (+${bonus.agi})</strong>
                </div>
              </div>
            </div>

            <!-- 5 Slots Stack -->
            <div class="vb-slots-list">
              ${slotKeys
                .map((slot) => {
                  const eq = activeUnit.equipment[slot];
                  if (eq) {
                    return `
                    <div class="vb-slot-card equipped">
                      <div style="font-size: 24px;">${eq.icon}</div>
                      <div style="flex: 1;">
                        <div style="font-size: 10px; color: #fbbf24; font-weight: 600;">${slotLabels[slot]}</div>
                        <div style="font-size: 13px; font-weight: 600; color: #f8fafc;">${eq.name}</div>
                        <div style="font-size: 11px; color: #4ade80;">${eq.stats}</div>
                      </div>
                      <button class="btn-unequip-sm" onclick="unequip('${slot}')">✕ Unequip</button>
                    </div>
                  `;
                  }
                  return `
                  <div class="vb-slot-card">
                    <div style="font-size: 20px; opacity: 0.3;">${slotLabels[slot].split(" ")[0]}</div>
                    <div style="flex: 1;">
                      <div style="font-size: 10px; color: #64748b;">${slotLabels[slot]}</div>
                      <div style="font-size: 12px; color: #64748b;">[ว่าง - คลิกเลือกใส่จากกระเป๋า]</div>
                    </div>
                  </div>
                `;
                })
                .join("")}
            </div>
          </div>
        </div>
      `;
      }

      function renderVariantC() {
        const slotKeys = ["weapon", "head", "armor", "boots", "accessory"];
        return `
        <div class="variant-c">
          ${state.units
            .slice(0, 3)
            .map((u) => {
              const bonus = calcBonus(u);
              return `
              <div class="vc-party-card ${u.id === "hero" ? "hero-card" : ""}">
                <div class="vc-header">
                  <div class="vc-avatar">${u.avatar}</div>
                  <div class="vc-meta">
                    <h4>${u.name}</h4>
                    <p>${u.elementIcon} Lv.${u.level} &bull; ATK ${u.baseStats.atk + bonus.atk} (+${bonus.atk})</p>
                  </div>
                </div>

                <div class="vc-slots-compact">
                  ${slotKeys
                    .map((slot) => {
                      const eq = u.equipment[slot];
                      if (eq) {
                        return `
                        <div class="vc-compact-slot equipped">
                          <span>${eq.icon} ${eq.name.slice(0, 16)}</span>
                          <span style="font-size: 9px; cursor: pointer; color: #f87171;" onclick="state.selectedUnitId = '${u.id}'; unequip('${slot}');">✕</span>
                        </div>
                      `;
                      }
                      return `
                      <div class="vc-compact-slot" style="opacity: 0.4;">
                        <span>${slot.toUpperCase()}</span>
                        <span>[ว่าง]</span>
                      </div>
                    `;
                    })
                    .join("")}
                </div>
              </div>
            `;
            })
            .join("")}
        </div>
      `;
      }

      function setVariant(index) {
        currentVariantIndex = (index + variants.length) % variants.length;
        const v = variants[currentVariantIndex];
        const url = new URL(window.location.href);
        url.searchParams.set("variant", v.key);
        window.history.replaceState({}, "", url.toString());
        render();
      }

      function render() {
        const v = variants[currentVariantIndex];
        document.getElementById("switcher-text").innerHTML = `
        <strong>Variant ${v.key}</strong> <span class="switcher-sub">(${v.name})</span>
      `;
        document.getElementById("variant-container").innerHTML = v.render();
      }

      // Keyboard navigation
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") setVariant(currentVariantIndex - 1);
        if (e.key === "ArrowRight") setVariant(currentVariantIndex + 1);
      });

      document.getElementById("btn-prev").onclick = () =>
        setVariant(currentVariantIndex - 1);
      document.getElementById("btn-next").onclick = () =>
        setVariant(currentVariantIndex + 1);

      // Initial variant from URL
      const urlParams = new URLSearchParams(window.location.search);
      const initialKey = urlParams.get("variant") || "A";
      const foundIndex = variants.findIndex(
        (v) => v.key.toUpperCase() === initialKey.toUpperCase()
      );
      if (foundIndex !== -1) currentVariantIndex = foundIndex;

      render();
    </script>
  </body>
</html>
