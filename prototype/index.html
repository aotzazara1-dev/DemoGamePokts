<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poktsonline - TS Online Visual Combat Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #090b10;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 1024px;
      height: 640px;
      background: #111827;
      border: 3px solid #374151;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.1);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    /* RETRO MMORPG HUD */
    #hud-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 110px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.85) 0%, rgba(2, 6, 23, 0.98) 100%);
      border-top: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      backdrop-filter: blur(8px);
      z-index: 20;
    }
    .hud-portrait {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .hud-portrait:hover {
      background: rgba(51, 65, 85, 0.8);
      border-color: #38bdf8;
    }
    .portrait-avatar {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background: #1e293b;
      border: 2px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    .hud-bars {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 130px;
    }
    .bar-wrap {
      height: 10px;
      background: #0f172a;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #334155;
      position: relative;
    }
    .bar-fill-hp {
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #f87171);
      transition: width 0.3s ease;
    }
    .bar-fill-sp {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      transition: width 0.3s ease;
    }
    .bar-text {
      position: absolute;
      right: 4px;
      top: -1px;
      font-size: 8px;
      font-family: monospace;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 1px #000;
    }

    /* ACTION BUTTONS (TS ONLINE STYLE) */
    .action-group {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
      border: 2px solid #64748b;
      border-radius: 10px;
      color: #f1f5f9;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .action-btn span.icon {
      font-size: 24px;
      margin-bottom: 2px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .action-btn:hover {
      background: linear-gradient(180deg, #475569 0%, #334155 100%);
      border-color: #38bdf8;
      transform: translateY(-3px);
      box-shadow: 0 8px 12px rgba(56, 189, 248, 0.25);
    }
    .action-btn.active {
      border-color: #fbbf24;
      background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.6);
      transform: translateY(-2px);
    }
    .action-btn:active {
      transform: translateY(1px);
    }

    /* READY / RESOLVE BUTTON */
    .btn-resolve {
      height: 72px;
      padding: 0 20px;
      background: linear-gradient(180deg, #10b981 0%, #047857 100%);
      border: 2px solid #34d399;
      border-radius: 10px;
      color: white;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }
    .btn-resolve:hover {
      background: linear-gradient(180deg, #34d399 0%, #059669 100%);
      box-shadow: 0 0 30px rgba(52, 211, 153, 0.7);
      transform: scale(1.04);
    }
    .btn-resolve:active {
      transform: scale(0.96);
    }

    /* TOP STATUS OVERLAYS */
    #hud-top {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .badge-round {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: bold;
      font-size: 13px;
      color: #94a3b8;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .badge-round span {
      color: #38bdf8;
      font-size: 16px;
    }
    .badge-timer {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #eab308;
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: 900;
      font-size: 16px;
      color: #facc15;
      font-family: monospace;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 15px rgba(234, 179, 8, 0.2);
    }

    /* DRAMATIC BANNERS */
    #banner-combo {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: linear-gradient(90deg, transparent, rgba(234, 88, 12, 0.95), transparent);
      padding: 14px 80px;
      color: #fff;
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #ffedd5, 0 0 40px #ea580c;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 30;
      text-align: center;
    }
    #banner-combo.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* CONTROLS HINT */
    #hint-bar {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 6px 18px;
      font-size: 12px;
      color: #94a3b8;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #hint-bar strong {
      color: #f8fafc;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="1024" height="640"></canvas>

    <!-- Top Overlays -->
    <div id="hud-top">
      <div class="badge-round">
        ROUND: <span id="txtRound">1</span> | POKTSONLINE BATTLE ARENA
      </div>
      <div id="txtTimer" class="badge-timer">
        ⏱️ 30s
      </div>
    </div>

    <!-- Instruction Hint -->
    <div id="hint-bar">
      <span>🎯 <strong>คลิกที่เป้าหมายศัตรู</strong> เพื่อเปลี่ยนเป้า</span>
      <span>•</span>
      <span>⚡ <strong>Hero และ สัตว์อสูร</strong> โจมตีเป้าเดียวกันจะเกิด <strong>COMBO!</strong></span>
      <span>•</span>
      <span>🔊 มีเสียงเอฟเฟกต์ต่อสู้</span>
    </div>

    <!-- Combo Popup Banner -->
    <div id="banner-combo">⚡ COMBINATION ATTACK! x2 ⚡</div>

    <!-- Retro MMORPG HUD Bottom -->
    <div id="hud-bottom">
      
      <!-- Unit 1: Hero -->
      <div class="hud-portrait" id="card-hero" onclick="selectUnit('hero')">
        <div class="portrait-avatar" style="border-color:#38bdf8;">🗡️</div>
        <div>
          <div style="font-size: 12px; font-weight: bold; color: #fff;">Hero Liu <span style="font-size: 10px; color: #f87171;">[ไฟ/Lv.15]</span></div>
          <div class="hud-bars" style="margin-top: 4px;">
            <div class="bar-wrap">
              <div id="hero-hp-bar" class="bar-fill-hp" style="width: 100%;"></div>
              <span id="hero-hp-text" class="bar-text">240/240</span>
            </div>
            <div class="bar-wrap">
              <div id="hero-sp-bar" class="bar-fill-sp" style="width: 100%;"></div>
              <span id="hero-sp-text" class="bar-text">90/90</span>
            </div>
          </div>
          <div id="hero-action-text" style="font-size: 10px; color: #38bdf8; margin-top: 3px; font-weight: bold;">
            ▶ คำสั่ง: โจมตี
          </div>
        </div>
      </div>

      <!-- Unit 2: Beast -->
      <div class="hud-portrait" id="card-beast" onclick="selectUnit('beast')" style="opacity: 0.7;">
        <div class="portrait-avatar" style="border-color:#fbbf24;">🐺</div>
        <div>
          <div style="font-size: 12px; font-weight: bold; color: #fff;">Flame Pup <span style="font-size: 10px; color: #f87171;">[ไฟ/Lv.14]</span></div>
          <div class="hud-bars" style="margin-top: 4px;">
            <div class="bar-wrap">
              <div id="beast-hp-bar" class="bar-fill-hp" style="width: 100%;"></div>
              <span id="beast-hp-text" class="bar-text">190/190</span>
            </div>
            <div class="bar-wrap">
              <div id="beast-sp-bar" class="bar-fill-sp" style="width: 100%;"></div>
              <span id="beast-sp-text" class="bar-text">60/60</span>
            </div>
          </div>
          <div id="beast-action-text" style="font-size: 10px; color: #fbbf24; margin-top: 3px; font-weight: bold;">
            ▶ คำสั่ง: โจมตี
          </div>
        </div>
      </div>

      <!-- Action Palette Buttons -->
      <div class="action-group">
        <button class="action-btn active" id="btn-attack" onclick="setAction('attack')">
          <span class="icon">⚔️</span>
          <span>โจมตี</span>
        </button>
        <button class="action-btn" id="btn-skill" onclick="setAction('skill')">
          <span class="icon">🔥</span>
          <span>สกิลธาตุ</span>
        </button>
        <button class="action-btn" id="btn-defend" onclick="setAction('defend')">
          <span class="icon">🛡️</span>
          <span>ป้องกัน</span>
        </button>
        <button class="action-btn" id="btn-capture" onclick="setAction('capture')">
          <span class="icon">🪤</span>
          <span>จับมอน</span>
        </button>
        <button class="action-btn" id="btn-item" onclick="setAction('item')">
          <span class="icon">🧪</span>
          <span>ไอเทม</span>
        </button>
        <button class="action-btn" id="btn-flee" onclick="setAction('flee')">
          <span class="icon">💨</span>
          <span>หลบหนี</span>
        </button>
      </div>

      <!-- Execute Round Button -->
      <button class="btn-resolve" onclick="executeTurn()">
        <span>⚡ ลุยเลย!</span>
        <span style="font-size: 10px; font-weight: normal; opacity: 0.85;">(EXECUTE TURN)</span>
      </button>

    </div>
  </div>

  <script>
    // --- 1. WEB AUDIO SYNTHESIZER ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      if (!audioCtx) audioCtx = new AudioCtx();
      const now = audioCtx.currentTime;

      if (type === 'hit') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'slash') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'combo') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'select') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(540, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'capture') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.2, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.01, now + (i + 1) * 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + (i + 1) * 0.08);
        });
      }
    }

    // --- 2. GAME UNITS & STATE ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const ELEMENTS = {
      EARTH: { name: 'ดิน', color: '#eab308', strongAgainst: 'WATER' },
      WATER: { name: 'น้ำ', color: '#38bdf8', strongAgainst: 'FIRE' },
      FIRE:  { name: 'ไฟ', color: '#ef4444', strongAgainst: 'WIND' },
      WIND:  { name: 'ลม', color: '#10b981', strongAgainst: 'EARTH' }
    };

    let selectedUnitId = 'hero';
    let currentTargetId = 'enemy_front_2';
    let roundNumber = 1;
    let turnTimer = 30;
    let isResolving = false;
    let screenShake = 0;

    let hero = {
      id: 'hero',
      name: 'Hero Liu',
      type: 'HERO',
      element: 'FIRE',
      level: 15,
      hp: 240, maxHp: 240,
      sp: 90, maxSp: 90,
      atk: 42, def: 25, agi: 34,
      grid: { row: 'back', col: 1 },
      baseX: 240, baseY: 380,
      x: 240, y: 380,
      targetX: 240, targetY: 380,
      action: 'attack',
      targetId: 'enemy_front_2',
      isDefending: false,
      color: '#38bdf8',
      animOffset: 0
    };

    let beast = {
      id: 'beast',
      name: 'Flame Pup',
      type: 'BEAST',
      element: 'FIRE',
      level: 14,
      hp: 190, maxHp: 190,
      sp: 60, maxSp: 60,
      atk: 36, def: 18, agi: 32,
      grid: { row: 'back', col: 2 },
      baseX: 180, baseY: 320,
      x: 180, y: 320,
      targetX: 180, targetY: 320,
      action: 'attack',
      targetId: 'enemy_front_2',
      isDefending: false,
      color: '#fbbf24',
      animOffset: 1.5
    };

    let enemies = [
      {
        id: 'enemy_front_2',
        name: 'Earth Golem',
        element: 'EARTH',
        level: 13,
        hp: 320, maxHp: 320,
        atk: 32, def: 34, agi: 16,
        grid: { row: 'front', col: 2 },
        baseX: 680, baseY: 340,
        x: 680, y: 340,
        color: '#eab308',
        isEnemy: true,
        animOffset: 0.8
      },
      {
        id: 'enemy_front_1',
        name: 'Wild Wolf',
        element: 'WIND',
        level: 12,
        hp: 170, maxHp: 170,
        atk: 30, def: 16, agi: 38,
        grid: { row: 'front', col: 1 },
        baseX: 620, baseY: 280,
        x: 620, y: 280,
        color: '#10b981',
        isEnemy: true,
        animOffset: 2.2
      },
      {
        id: 'enemy_back_2',
        name: 'Wind Hawk',
        element: 'WIND',
        level: 14,
        hp: 180, maxHp: 180,
        atk: 35, def: 15, agi: 44,
        grid: { row: 'back', col: 2 },
        baseX: 780, baseY: 300,
        x: 780, y: 300,
        color: '#34d399',
        isEnemy: true,
        animOffset: 3.1
      }
    ];

    let combatTexts = [];
    let slashEffects = [];

    function addCombatText(x, y, text, color = '#f87171', size = 22) {
      combatTexts.push({
        x: x,
        y: y,
        text: text,
        color: color,
        size: size,
        alpha: 1.0,
        vy: -1.8,
        life: 55
      });
    }

    function addSlashEffect(x, y, color = '#ffffff') {
      slashEffects.push({
        x: x,
        y: y,
        color: color,
        life: 14,
        maxLife: 14,
        angle: Math.random() * Math.PI
      });
    }

    // --- 3. RENDERING ---
    function drawBattlefield() {
      ctx.save();

      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        screenShake *= 0.85;
        if (screenShake < 0.5) screenShake = 0;
      }

      const skyGrad = ctx.createLinearGradient(0, 0, 0, 300);
      skyGrad.addColorStop(0, '#0c1a2e');
      skyGrad.addColorStop(0.5, '#1e293b');
      skyGrad.addColorStop(1, '#334155');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, 300);

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.moveTo(0, 240);
      ctx.lineTo(180, 140);
      ctx.lineTo(360, 240);
      ctx.lineTo(540, 110);
      ctx.lineTo(760, 240);
      ctx.lineTo(1024, 160);
      ctx.lineTo(1024, 300);
      ctx.lineTo(0, 300);
      ctx.fill();

      const groundGrad = ctx.createLinearGradient(0, 200, 0, 640);
      groundGrad.addColorStop(0, '#154228');
      groundGrad.addColorStop(0.3, '#1e5e3a');
      groundGrad.addColorStop(1, '#0e3a22');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, 200, canvas.width, 440);

      ctx.fillStyle = 'rgba(120, 85, 50, 0.4)';
      ctx.beginPath();
      ctx.ellipse(512, 380, 420, 160, -0.2, 0, Math.PI * 2);
      ctx.fill();

      drawFormationRings();

      let allUnits = [hero, beast, ...enemies].filter(u => u.hp > 0);
      allUnits.sort((a, b) => a.y - b.y);

      allUnits.forEach(unit => {
        drawUnit(unit);
      });

      drawEffects();
      drawCombatTexts();

      ctx.restore();
    }

    function drawFormationRings() {
      drawGroundRing(240, 380, '#38bdf8', hero.id === currentTargetId);
      drawGroundRing(180, 320, '#fbbf24', beast.id === currentTargetId);

      enemies.forEach(e => {
        if (e.hp > 0) {
          const isTargeted = (e.id === currentTargetId);
          drawGroundRing(e.baseX, e.baseY, isTargeted ? '#ef4444' : '#64748b', isTargeted);
        }
      });
    }

    function drawGroundRing(x, y, color, isTargeted) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(x, y + 25, isTargeted ? 34 : 26, isTargeted ? 17 : 13, 0, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = isTargeted ? 3 : 1.5;
      if (isTargeted) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
        ctx.fill();
        ctx.shadowColor = color;
        ctx.shadowBlur = 15;
      }
      ctx.stroke();

      if (isTargeted) {
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('▼ TARGET', x, y - 65);
      }
      ctx.restore();
    }

    function drawUnit(unit) {
      ctx.save();
      const time = performance.now() * 0.004;
      const bobY = Math.sin(time + unit.animOffset) * 4;
      const drawX = unit.x;
      const drawY = unit.y + bobY;

      ctx.beginPath();
      ctx.ellipse(drawX, unit.y + 24, 20, 8, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fill();

      if (unit.id === 'hero') {
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.moveTo(drawX - 12, drawY - 10);
        ctx.lineTo(drawX - 24, drawY + 18);
        ctx.lineTo(drawX - 6, drawY + 16);
        ctx.fill();

        ctx.fillStyle = '#1e3a8a';
        ctx.beginPath();
        ctx.roundRect(drawX - 12, drawY - 20, 24, 28, 5);
        ctx.fill();
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(drawX - 8, drawY - 4, 16, 4);

        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.arc(drawX, drawY - 30, 11, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.moveTo(drawX - 2, drawY - 40);
        ctx.lineTo(drawX + 8, drawY - 48);
        ctx.lineTo(drawX + 4, drawY - 38);
        ctx.fill();

        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(drawX + 14, drawY - 12);
        ctx.lineTo(drawX + 28, drawY - 28);
        ctx.stroke();
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(drawX + 12, drawY - 14, 6, 6);

      } else if (unit.id === 'beast') {
        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.ellipse(drawX, drawY - 8, 18, 13, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(drawX + 12, drawY - 18, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.moveTo(drawX + 8, drawY - 26);
        ctx.lineTo(drawX + 14, drawY - 36);
        ctx.lineTo(drawX + 18, drawY - 26);
        ctx.fill();

        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.arc(drawX - 18, drawY - 18, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(drawX - 20, drawY - 22, 4, 0, Math.PI * 2);
        ctx.fill();

      } else if (unit.name.includes('Golem')) {
        ctx.fillStyle = '#78716c';
        ctx.beginPath();
        ctx.roundRect(drawX - 22, drawY - 32, 44, 46, 8);
        ctx.fill();
        ctx.strokeStyle = '#44403c';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#facc15';
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(drawX, drawY - 15, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#57534e';
        ctx.beginPath();
        ctx.arc(drawX - 22, drawY - 25, 9, 0, Math.PI * 2);
        ctx.arc(drawX + 22, drawY - 25, 9, 0, Math.PI * 2);
        ctx.fill();

      } else if (unit.name.includes('Hawk')) {
        const wingFlap = Math.cos(time * 2.5) * 12;
        ctx.fillStyle = '#059669';
        ctx.beginPath();
        ctx.moveTo(drawX - 28, drawY - 20 + wingFlap);
        ctx.lineTo(drawX, drawY - 15);
        ctx.lineTo(drawX + 28, drawY - 20 + wingFlap);
        ctx.lineTo(drawX, drawY - 5);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.arc(drawX, drawY - 22, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(drawX - 3, drawY - 22);
        ctx.lineTo(drawX - 10, drawY - 20);
        ctx.lineTo(drawX - 3, drawY - 18);
        ctx.fill();

      } else {
        ctx.fillStyle = unit.color || '#94a3b8';
        ctx.beginPath();
        ctx.roundRect(drawX - 16, drawY - 18, 32, 26, 6);
        ctx.fill();
      }

      ctx.textAlign = 'center';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#000000';
      ctx.shadowBlur = 4;
      ctx.fillText(unit.name, drawX, drawY - 52);

      const hpWidth = 44;
      const hpHeight = 5;
      const hpRatio = Math.max(0, unit.hp / unit.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(drawX - hpWidth/2, drawY - 48, hpWidth, hpHeight);
      ctx.fillStyle = unit.isEnemy ? '#ef4444' : '#22c55e';
      ctx.fillRect(drawX - hpWidth/2, drawY - 48, hpWidth * hpRatio, hpHeight);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      ctx.strokeRect(drawX - hpWidth/2, drawY - 48, hpWidth, hpHeight);

      if (unit.isDefending) {
        ctx.fillStyle = '#38bdf8';
        ctx.font = '16px sans-serif';
        ctx.fillText('🛡️', drawX, drawY + 10);
      }

      ctx.restore();
    }

    function drawEffects() {
      slashEffects.forEach((fx) => {
        ctx.save();
        ctx.translate(fx.x, fx.y);
        ctx.rotate(fx.angle);
        const progress = 1 - (fx.life / fx.maxLife);
        ctx.strokeStyle = fx.color;
        ctx.lineWidth = 6 * (1 - progress);
        ctx.shadowColor = fx.color;
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.arc(0, 0, 36, -Math.PI * 0.4, Math.PI * 0.4);
        ctx.stroke();
        ctx.restore();

        fx.life--;
      });
      slashEffects = slashEffects.filter(fx => fx.life > 0);
    }

    function drawCombatTexts() {
      combatTexts.forEach((ct) => {
        ctx.save();
        ctx.font = `900 ${ct.size}px Impact, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = ct.color;
        ctx.globalAlpha = ct.alpha;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 6;
        ctx.fillText(ct.text, ct.x, ct.y);
        ctx.restore();

        ct.y += ct.vy;
        ct.life--;
        if (ct.life < 20) {
          ct.alpha = ct.life / 20;
        }
      });
      combatTexts = combatTexts.filter(ct => ct.life > 0);
    }

    // --- 4. GAME ENGINE LOOP ---
    function update() {
      [hero, beast, ...enemies].forEach(u => {
        u.x += (u.targetX - u.x) * 0.18;
        u.y += (u.targetY - u.y) * 0.18;
      });
    }

    function gameLoop() {
      update();
      drawBattlefield();
      requestAnimationFrame(gameLoop);
    }

    // --- 5. INTERACTIVE TARGETING & CONTROLS ---
    canvas.addEventListener('click', (e) => {
      if (isResolving) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      enemies.forEach(enemy => {
        if (enemy.hp <= 0) return;
        const dist = Math.hypot(clickX - enemy.x, clickY - (enemy.y - 10));
        if (dist < 45) {
          currentTargetId = enemy.id;
          const activeUnit = selectedUnitId === 'hero' ? hero : beast;
          activeUnit.targetId = enemy.id;
          playSound('select');
          updateHUD();
        }
      });
    });

    function selectUnit(id) {
      selectedUnitId = id;
      playSound('select');
      document.getElementById('card-hero').style.opacity = id === 'hero' ? '1.0' : '0.6';
      document.getElementById('card-beast').style.opacity = id === 'beast' ? '1.0' : '0.6';
      
      const activeUnit = id === 'hero' ? hero : beast;
      highlightActionButton(activeUnit.action);
    }

    function setAction(actionName) {
      const activeUnit = selectedUnitId === 'hero' ? hero : beast;
      if (actionName === 'capture' && activeUnit.type !== 'HERO') {
        alert('เฉพาะ Hero เท่านั้นที่สามารถใช้คำสั่งจับสัตว์อสูรได้!');
        return;
      }
      activeUnit.action = actionName;
      playSound('select');
      highlightActionButton(actionName);
      updateHUD();
    }

    function highlightActionButton(actionName) {
      ['attack', 'skill', 'defend', 'capture', 'item', 'flee'].forEach(act => {
        const btn = document.getElementById(`btn-${act}`);
        if (btn) {
          if (act === actionName) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });
    }

    function updateHUD() {
      document.getElementById('hero-hp-bar').style.width = `${Math.max(0, (hero.hp/hero.maxHp)*100)}%`;
      document.getElementById('hero-hp-text').textContent = `${hero.hp}/${hero.maxHp}`;
      document.getElementById('hero-sp-bar').style.width = `${Math.max(0, (hero.sp/hero.maxSp)*100)}%`;
      document.getElementById('hero-sp-text').textContent = `${hero.sp}/${hero.maxSp}`;
      document.getElementById('hero-action-text').textContent = `▶ คำสั่ง: ${getActionThai(hero.action)}`;

      document.getElementById('beast-hp-bar').style.width = `${Math.max(0, (beast.hp/beast.maxHp)*100)}%`;
      document.getElementById('beast-hp-text').textContent = `${beast.hp}/${beast.maxHp}`;
      document.getElementById('beast-sp-bar').style.width = `${Math.max(0, (beast.sp/beast.maxSp)*100)}%`;
      document.getElementById('beast-sp-text').textContent = `${beast.sp}/${beast.maxSp}`;
      document.getElementById('beast-action-text').textContent = `▶ คำสั่ง: ${getActionThai(beast.action)}`;
    }

    function getActionThai(act) {
      switch(act) {
        case 'attack': return 'โจมตี';
        case 'skill': return 'สกิลธาตุ';
        case 'defend': return 'ป้องกัน';
        case 'capture': return 'จับมอน';
        case 'item': return 'ใช้ไอเทม';
        case 'flee': return 'หลบหนี';
        default: return act;
      }
    }

    // --- 6. FULL TURN RESOLUTION WITH VISUAL ANIMATIONS ---
    async function executeTurn() {
      if (isResolving) return;
      isResolving = true;

      const targetEnemy = enemies.find(e => e.id === hero.targetId && e.hp > 0);
      const isCombo = (
        hero.hp > 0 && beast.hp > 0 &&
        hero.action === 'attack' && beast.action === 'attack' &&
        hero.targetId === beast.targetId &&
        Math.abs(hero.agi - beast.agi) <= 15 &&
        targetEnemy
      );

      if (isCombo) {
        const banner = document.getElementById('banner-combo');
        banner.classList.add('show');
        playSound('combo');
        await wait(600);
        banner.classList.remove('show');

        hero.targetX = targetEnemy.baseX - 70;
        hero.targetY = targetEnemy.baseY + 10;
        beast.targetX = targetEnemy.baseX - 60;
        beast.targetY = targetEnemy.baseY - 20;
        await wait(280);

        addSlashEffect(targetEnemy.baseX, targetEnemy.baseY - 15, '#f59e0b');
        addSlashEffect(targetEnemy.baseX + 10, targetEnemy.baseY - 5, '#ef4444');
        playSound('combo');
        playSound('hit');
        screenShake = 16;

        const combinedAtk = (hero.atk + beast.atk) * 1.8;
        const totalDmg = Math.round(Math.max(1, combinedAtk - targetEnemy.def));
        targetEnemy.hp = Math.max(0, targetEnemy.hp - totalDmg);

        addCombatText(targetEnemy.baseX, targetEnemy.baseY - 30, `COMBO! -${totalDmg}`, '#f59e0b', 28);
        await wait(450);

        hero.targetX = hero.baseX;
        hero.targetY = hero.baseY;
        beast.targetX = beast.baseX;
        beast.targetY = beast.baseY;
        await wait(300);

      } else {
        let combatants = [hero, beast, ...enemies].filter(u => u.hp > 0);
        combatants.sort((a, b) => b.agi - a.agi);

        for (const unit of combatants) {
          if (unit.hp <= 0) continue;
          await resolveUnitActionAnimated(unit);
          await wait(200);
        }
      }

      const livingEnemies = enemies.filter(e => e.hp > 0);
      if (livingEnemies.length === 0) {
        playSound('capture');
        alert('🎉 ชนะการต่อสู้! ศัตรูทั้งหมดพ่ายแพ้แล้ว!');
        resetBattle();
      } else if (hero.hp <= 0 && beast.hp <= 0) {
        alert('💀 พ่ายแพ้! ตัวละครสลบทั้งหมด');
        resetBattle();
      }

      roundNumber++;
      document.getElementById('txtRound').textContent = roundNumber;
      updateHUD();
      isResolving = false;
    }

    async function resolveUnitActionAnimated(unit) {
      if (unit.action === 'defend') {
        unit.isDefending = true;
        addCombatText(unit.baseX, unit.baseY - 20, '🛡️ DEFEND', '#38bdf8', 18);
        playSound('select');
        return;
      }

      if (unit.action === 'item') {
        unit.hp = Math.min(unit.maxHp, unit.hp + 90);
        addCombatText(unit.baseX, unit.baseY - 20, '+90 HP', '#22c55e', 20);
        playSound('capture');
        updateHUD();
        return;
      }

      if (unit.action === 'flee') {
        playSound('slash');
        addCombatText(unit.baseX, unit.baseY - 20, 'FLEE ESCAPED!', '#a855f7', 22);
        await wait(500);
        alert('💨 หลบหนีออกจากการต่อสู้สำเร็จ!');
        resetBattle();
        return;
      }

      let target = null;
      if (unit.isEnemy) {
        target = hero.hp > 0 ? hero : beast;
      } else {
        target = enemies.find(e => e.id === unit.targetId && e.hp > 0) || enemies.find(e => e.hp > 0);
      }
      if (!target || target.hp <= 0) return;

      if (unit.action === 'capture') {
        playSound('capture');
        addCombatText(target.baseX, target.baseY - 40, '🪤 CAPTURE NET!', '#38bdf8', 20);
        await wait(600);

        const hpRatio = target.hp / target.maxHp;
        const captureChance = Math.max(0.2, (1 - hpRatio) * 0.9);
        if (unit.level >= target.level && Math.random() < captureChance) {
          target.hp = 0;
          playSound('combo');
          addCombatText(target.baseX, target.baseY - 20, '✨ CAPTURED! ✨', '#facc15', 26);
          await wait(500);
        } else {
          playSound('hit');
          addCombatText(target.baseX, target.baseY - 20, 'FAILED!', '#94a3b8', 20);
        }
        return;
      }

      unit.targetX = target.baseX + (unit.isEnemy ? 55 : -55);
      unit.targetY = target.baseY;
      await wait(240);

      const isSkill = unit.action === 'skill';
      playSound(isSkill ? 'combo' : 'slash');
      playSound('hit');
      addSlashEffect(target.baseX, target.baseY - 10, isSkill ? '#ef4444' : '#f8fafc');
      screenShake = 10;

      const mult = isSkill ? 2.5 : 2.0;
      let dmg = Math.round(Math.max(1, (unit.atk * mult) - target.def));
      if (target.isDefending) dmg = Math.round(dmg * 0.5);

      target.hp = Math.max(0, target.hp - dmg);
      addCombatText(target.baseX, target.baseY - 20, `-${dmg}`, isSkill ? '#f97316' : '#f87171', isSkill ? 26 : 22);
      updateHUD();
      await wait(300);

      unit.targetX = unit.baseX;
      unit.targetY = unit.baseY;
      await wait(200);
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function resetBattle() {
      hero.hp = hero.maxHp;
      hero.sp = hero.maxSp;
      hero.x = hero.baseX; hero.y = hero.baseY;
      hero.targetX = hero.baseX; hero.targetY = hero.baseY;
      hero.isDefending = false;

      beast.hp = beast.maxHp;
      beast.sp = beast.maxSp;
      beast.x = beast.baseX; beast.y = beast.baseY;
      beast.targetX = beast.baseX; beast.targetY = beast.baseY;
      beast.isDefending = false;

      enemies = [
        {
          id: 'enemy_front_2',
          name: 'Earth Golem',
          element: 'EARTH',
          level: 13,
          hp: 320, maxHp: 320,
          atk: 32, def: 34, agi: 16,
          baseX: 680, baseY: 340,
          x: 680, y: 340, targetX: 680, targetY: 340,
          color: '#eab308',
          isEnemy: true,
          animOffset: 0.8
        },
        {
          id: 'enemy_front_1',
          name: 'Wild Wolf',
          element: 'WIND',
          level: 12,
          hp: 170, maxHp: 170,
          atk: 30, def: 16, agi: 38,
          baseX: 620, baseY: 280,
          x: 620, y: 280, targetX: 620, targetY: 280,
          color: '#10b981',
          isEnemy: true,
          animOffset: 2.2
        },
        {
          id: 'enemy_back_2',
          name: 'Wind Hawk',
          element: 'WIND',
          level: 14,
          hp: 180, maxHp: 180,
          atk: 35, def: 15, agi: 44,
          baseX: 780, baseY: 300,
          x: 780, y: 300, targetX: 780, targetY: 300,
          color: '#34d399',
          isEnemy: true,
          animOffset: 3.1
        }
      ];

      currentTargetId = 'enemy_front_2';
      roundNumber = 1;
      document.getElementById('txtRound').textContent = roundNumber;
      updateHUD();
    }

    updateHUD();
    gameLoop();
  </script>
</body>
</html>
